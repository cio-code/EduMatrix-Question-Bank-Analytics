<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify a Certificate - EduMatrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex items-start sm:items-center justify-center p-4" style="background:#EEF3ED">
  <main class="w-full max-w-md">
    <div class="bg-white border rounded-2xl shadow-sm p-6 space-y-5" style="border-color:#BFCFBB">
      <div class="flex items-center gap-3">
        <img src="assets/logo.png" alt="School seal" class="w-14 h-14">
        <div>
          <h1 class="text-lg font-bold leading-tight" style="color:#344C3D">Certificate Verification</h1>
          <p class="text-xs" style="color:#738A6E">J.H. Cerilles State College · Departmental Exam Question Bank</p>
        </div>
      </div>

      <form id="vf" class="space-y-2">
        <label for="serial" class="block text-sm font-semibold text-slate-700">Certificate serial number</label>
        <div class="flex gap-2">
          <input id="serial" class="flex-1 border rounded-lg px-3 py-2 text-base uppercase tracking-wide" style="border-color:#8EA58C" placeholder="EDM-GEE101-XXXXXX" autocomplete="off" autocapitalize="characters" maxlength="30">
          <button id="go" type="submit" class="rounded-lg px-4 py-2 text-white font-semibold" style="background:#344C3D">Check</button>
        </div>
        <p class="text-xs text-slate-500">Scanning the QR code on a certificate fills this in automatically.</p>
      </form>

      <div id="result" aria-live="polite"></div>
    </div>
    <p class="text-center text-xs mt-3" style="color:#738A6E">EduMatrix · This page shows only what is printed on the certificate.</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      const out = document.getElementById("result");
      const esc = (v) => String(v === null || v === undefined ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-US", { timeZone: "Asia/Manila", year: "numeric", month: "long", day: "numeric" }); };

      function box(tone, title, body) {
        const t = { ok: ["#ECF6EC", "#2E7D4F", "#1B5E3A"], warn: ["#FFF7E6", "#D69E2E", "#8A5A00"], bad: ["#FDECEC", "#C0392B", "#8E1F14"] }[tone];
        out.innerHTML = '<div class="rounded-xl p-4" style="background:' + t[0] + ';border:2px solid ' + t[1] + '">' +
          '<div class="text-lg font-bold" style="color:' + t[2] + '">' + title + "</div>" + body + "</div>";
      }
      const row = (k, v) => '<div class="mt-2"><div class="text-xs uppercase tracking-wide text-slate-500">' + k + '</div><div class="text-base font-semibold text-slate-800">' + esc(v) + "</div></div>";

      async function check(serial) {
        serial = serial.trim().toUpperCase();
        if (!serial) { out.innerHTML = ""; return; }
        out.innerHTML = '<div class="text-sm text-slate-500">Checking…</div>';
        try {
          const r = await API.call("verifyCertificate", { serial: serial }, { noRedirect: true });
          if (!r.found) {
            box("bad", "&#10007; Not found", '<p class="text-sm mt-1 text-slate-700">This serial number is not in our records. Please check it for typing mistakes.</p>');
          } else if (!r.valid) {
            box("warn", "&#9888; Revoked", '<p class="text-sm mt-1 text-slate-700">This certificate was issued but has been revoked and is no longer valid.</p>' + row("Name", r.name) + row("Serial number", r.serial));
          } else {
            box("ok", "&#10003; Valid certificate",
              row("Presented to", r.name) + row("Course", r.course) + row("Questions contributed", r.items + " required questions completed") +
              row("Issued on", fmt(r.issuedAt)) + row("Serial number", r.serial));
          }
        } catch (e) {
          box("warn", "Could not check right now", '<p class="text-sm mt-1 text-slate-700">' + esc(e.message) + "</p>");
        }
      }

      document.getElementById("vf").addEventListener("submit", function (e) { e.preventDefault(); check(document.getElementById("serial").value); });
      const s = new URLSearchParams(location.search).get("s");
      if (s) { document.getElementById("serial").value = s.toUpperCase(); check(s); }
    })();
  </script>
</body>
</html>
